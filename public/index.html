<!doctype html>
<html lang="en" data-collection="profiles">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Profiles</title>
  <link rel="stylesheet" href="./app.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a href="#main" class="skip" data-zh="跳到正文">Skip to content</a>
  <div class="shell">
    <aside class="sidebar">
      <header class="brand"><h1>Profiles</h1><span data-zh="学术申请材料">Academic dossier</span></header>
      <button type="button" id="language">简体中文</button>
      <nav id="groups" aria-label="Document groups" data-zh-aria="文档分组"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <div class="heading">
        <h2 id="title" tabindex="-1" data-zh="全部文档">All documents</h2>
        <button type="button" id="reload" data-zh="刷新">Refresh</button>
      </div>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="directory" hidden>
        <label class="search"><span data-zh="查找文档">Find documents</span><input type="search" id="query" autocomplete="off" maxlength="200"></label>
        <ul id="list"></ul>
      </section>
      <section id="reader" hidden>
        <button type="button" id="back" data-zh="返回列表">Back to list</button>
        <p id="meta"></p>
        <div id="actions"></div>
        <pre id="text" hidden></pre>
      </section>
    </main>
  </div>
</body>
</html>
